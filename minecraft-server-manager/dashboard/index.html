<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Server Dashboard</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-card: #0f3460;
            --text-primary: #e0e0e0;
            --text-secondary: #8a8a9a;
            --accent-green: #4ecca3;
            --accent-red: #e74c3c;
            --accent-blue: #00b4d8;
            --accent-gold: #f0a500;
            --border: #2a2a4a;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 0;
        }

        header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 1.25rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.4rem;
            font-weight: 600;
        }

        .header-meta {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-align: right;
        }

        .header-meta span { color: var(--accent-gold); }

        main { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }

        /* Summary cards row */
        .summary {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .summary-card {
            flex: 1;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem 1.25rem;
        }

        .summary-card .label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.35rem;
        }

        .summary-card .value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-gold);
        }

        .summary-card .value.small { font-size: 1.1rem; }

        /* Section headings */
        .section-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            padding-bottom: 0.35rem;
            border-bottom: 1px solid var(--border);
        }

        /* Server cards grid */
        .server-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .server-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem 1.25rem;
            position: relative;
            overflow: hidden;
        }

        .server-card > .banner-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            opacity: 0.18;
        }

        .server-card > .banner-fade {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, transparent 30%, var(--bg-secondary) 100%);
        }

        .server-card > *:not(.banner-bg):not(.banner-fade) {
            position: relative;
        }

        .server-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.4rem;
        }

        .server-card-header h3 {
            font-size: 1rem;
            font-weight: 600;
        }

        .server-card-status {
            margin-bottom: 0.75rem;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.2rem 0.6rem;
            border-radius: 999px;
        }

        .status-badge.online {
            background: rgba(78, 204, 163, 0.15);
            color: var(--accent-green);
        }

        .status-badge.offline {
            background: rgba(231, 76, 60, 0.15);
            color: var(--accent-red);
        }

        .status-badge.unresponsive {
            background: rgba(240, 165, 0, 0.15);
            color: var(--accent-gold);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        .status-badge.online .status-dot { background: var(--accent-green); }
        .status-badge.offline .status-dot { background: var(--accent-red); }
        .status-badge.unresponsive .status-dot { background: var(--accent-gold); }

        .server-detail {
            display: flex;
            justify-content: space-between;
            padding: 0.25rem 0;
            font-size: 0.85rem;
        }

        .server-detail .key { color: var(--text-secondary); }

        .bool-badge, .enum-badge {
            display: inline-block;
            font-size: 0.68rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            padding: 0.15rem 0.5rem;
            border-radius: 999px;
        }

        .bool-badge.is-true { background: rgba(78, 204, 163, 0.15); color: var(--accent-green); }
        .bool-badge.is-false { background: rgba(231, 76, 60, 0.15); color: var(--accent-red); }

        .enum-badge.enum-survival { background: rgba(78, 204, 163, 0.15); color: var(--accent-green); }
        .enum-badge.enum-creative { background: rgba(240, 165, 0, 0.15); color: var(--accent-gold); }
        .enum-badge.enum-adventure { background: rgba(0, 180, 216, 0.15); color: var(--accent-blue); }

        .enum-badge.enum-peaceful { background: rgba(78, 204, 163, 0.15); color: var(--accent-green); }
        .enum-badge.enum-easy { background: rgba(0, 180, 216, 0.15); color: var(--accent-blue); }
        .enum-badge.enum-normal { background: rgba(240, 165, 0, 0.15); color: var(--accent-gold); }
        .enum-badge.enum-hard { background: rgba(231, 76, 60, 0.15); color: var(--accent-red); }

        .enum-badge.enum-visitor { background: rgba(231, 76, 60, 0.15); color: var(--accent-red); }
        .enum-badge.enum-member { background: rgba(0, 180, 216, 0.15); color: var(--accent-blue); }
        .enum-badge.enum-operator { background: rgba(240, 165, 0, 0.15); color: var(--accent-gold); }

        .server-card-details {
            border-top: 1px solid var(--border);
            padding-top: 0.4rem;
        }

        /* Update history table */
        .history-section { margin-bottom: 1.5rem; }

        .history-table, .ports-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        .history-table th, .ports-table th {
            text-align: left;
            padding: 0.6rem 0.75rem;
            background: var(--bg-card);
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .history-table td, .ports-table td {
            padding: 0.5rem 0.75rem;
            border-bottom: 1px solid var(--border);
        }

        .history-table tr:hover td, .ports-table tr:hover td {
            background: rgba(15, 52, 96, 0.4);
        }

        /* Ports overview */
        .ports-section { margin-bottom: 1.5rem; }

        .ports-table td { vertical-align: middle; }

        .port-cell {
            color: var(--accent-gold);
            font-family: 'Consolas', 'Courier New', monospace;
            font-weight: 600;
        }

        td.port-conflict, .port-cell.port-conflict { color: var(--accent-red); }

        input.edit-input.port-conflict {
            border-color: var(--accent-red);
            color: var(--accent-red);
        }

        .ports-conflict-banner { margin-bottom: 0.75rem; }

        .ports-actions { text-align: right; white-space: nowrap; }
        .ports-actions .edit-btn, .ports-actions .swap-btn { margin-left: 0.35rem; }

        .swap-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 0.7rem;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .swap-btn:hover { border-color: var(--accent-green); color: var(--accent-green); }
        .swap-btn.swap-active { border-color: var(--accent-blue); color: var(--accent-blue); }

        .swap-source-row td { background: rgba(0, 180, 216, 0.08); }
        .swap-source-row td:first-child { border-left: 2px solid var(--accent-blue); }

        .port-input { width: 90px; }

        .ports-footnote {
            font-size: 0.72rem;
            color: var(--text-secondary);
            margin-top: 0.4rem;
        }

        .version-tag {
            color: var(--accent-gold);
            font-family: 'Consolas', 'Courier New', monospace;
            font-weight: 600;
        }

        /* Log viewer */
        .log-section { margin-bottom: 1.5rem; }

        .log-container {
            background: #0d1117;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            max-height: 350px;
            overflow-y: auto;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.78rem;
            line-height: 1.5;
        }

        .log-line { white-space: pre-wrap; word-break: break-all; }
        .log-timestamp { color: var(--accent-blue); }
        .log-message { color: var(--text-primary); }

        .log-line.error .log-message { color: var(--accent-red); }
        .log-line.warning .log-message { color: var(--accent-gold); }

        .log-meta {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 0.4rem;
            text-align: right;
        }

        /* Error / empty states */
        .empty-state {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .error-banner {
            background: rgba(231, 76, 60, 0.15);
            border: 1px solid var(--accent-red);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            margin-bottom: 1rem;
            color: var(--accent-red);
            font-size: 0.85rem;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        /* Edit mode */
        .card-actions {
            display: flex;
            gap: 0.4rem;
        }

        .edit-btn, .history-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 0.7rem;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .edit-btn:hover { border-color: var(--accent-blue); color: var(--accent-blue); }
        .history-btn:hover { border-color: var(--accent-gold); color: var(--accent-gold); }

        .restart-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 0.7rem;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .restart-btn:hover { border-color: var(--accent-red); color: var(--accent-red); }
        .restart-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Console toggle (second action row) + panel */
        .card-console-row { margin-bottom: 0.75rem; }

        .console-btn {
            width: 100%;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.3rem 0.5rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .console-btn:hover { border-color: var(--accent-blue); color: var(--accent-blue); }
        .console-btn.active { border-color: var(--accent-blue); color: var(--accent-blue); background: rgba(0, 180, 216, 0.08); }

        .console-panel {
            border-top: 1px solid var(--border);
            margin-top: 0.75rem;
            padding-top: 0.75rem;
        }

        .console-panel-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .console-panel-title {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .console-refresh-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 0.68rem;
            padding: 0.15rem 0.45rem;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .console-refresh-btn:hover { border-color: var(--accent-blue); color: var(--accent-blue); }

        .console-output {
            background: #0d1117;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.6rem 0.75rem;
            max-height: 260px;
            overflow-y: auto;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.72rem;
            line-height: 1.45;
        }

        .console-output .log-line { white-space: pre-wrap; word-break: break-all; color: var(--text-primary); }
        .console-output .log-line.stderr { color: var(--accent-red); }

        .console-divider {
            color: var(--accent-red);
            font-size: 0.66rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin: 0.5rem 0 0.25rem;
            border-top: 1px dashed rgba(231, 76, 60, 0.4);
            padding-top: 0.35rem;
        }

        .console-meta {
            display: flex;
            justify-content: space-between;
            gap: 0.5rem;
            font-size: 0.72rem;
            color: var(--text-secondary);
            margin-top: 0.4rem;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .restart-all-btn {
            background: transparent;
            border: 1px solid var(--accent-red);
            color: var(--accent-red);
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.4rem 0.9rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .restart-all-btn:hover { background: rgba(231, 76, 60, 0.15); }
        .restart-all-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .running-warning {
            background: rgba(240, 165, 0, 0.15);
            border: 1px solid var(--accent-gold);
            border-radius: 6px;
            padding: 0.5rem 0.75rem;
            margin-bottom: 0.75rem;
            color: var(--accent-gold);
            font-size: 0.78rem;
        }

        /* Update-pending banner + badges */
        .update-banner {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            background: rgba(240, 165, 0, 0.12);
            border: 1px solid var(--accent-gold);
            border-radius: 8px;
            padding: 0.7rem 1rem;
            margin-bottom: 1rem;
            color: var(--accent-gold);
            font-size: 0.85rem;
        }

        .update-banner .up-arrow { font-size: 1.1rem; line-height: 1; }
        .update-banner strong { color: var(--accent-gold); font-family: 'Consolas', 'Courier New', monospace; }
        .update-banner .update-hint { color: var(--text-secondary); }

        .update-error {
            background: rgba(231, 76, 60, 0.1);
            border: 1px solid rgba(231, 76, 60, 0.5);
            border-radius: 8px;
            padding: 0.6rem 1rem;
            margin-bottom: 1rem;
            color: var(--text-secondary);
            font-size: 0.8rem;
        }

        .update-pill {
            display: inline-block;
            font-size: 0.62rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            padding: 0.1rem 0.4rem;
            margin-left: 0.4rem;
            border-radius: 999px;
            background: rgba(240, 165, 0, 0.18);
            color: var(--accent-gold);
            vertical-align: middle;
        }

        .value.up-to-date { color: var(--accent-green); }
        .value.update-pending { color: var(--accent-gold); }

        .edit-form { display: flex; flex-direction: column; gap: 0.35rem; }

        .edit-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.2rem 0;
            font-size: 0.85rem;
        }

        .edit-label { color: var(--text-secondary); flex-shrink: 0; }

        .edit-input {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-radius: 4px;
            padding: 0.3rem 0.5rem;
            font-size: 0.82rem;
            width: 140px;
            text-align: right;
        }

        .edit-input:focus { outline: none; border-color: var(--accent-blue); }

        select.edit-input { cursor: pointer; }

        /* Toggle switch */
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 38px;
            height: 20px;
        }

        .toggle-switch input { opacity: 0; width: 0; height: 0; }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 20px;
            transition: 0.2s;
        }

        .toggle-slider::before {
            content: '';
            position: absolute;
            height: 14px;
            width: 14px;
            left: 2px;
            bottom: 2px;
            background: var(--text-secondary);
            border-radius: 50%;
            transition: 0.2s;
        }

        .toggle-switch input:checked + .toggle-slider { background: rgba(78, 204, 163, 0.3); border-color: var(--accent-green); }
        .toggle-switch input:checked + .toggle-slider::before { transform: translateX(18px); background: var(--accent-green); }

        .edit-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
            justify-content: flex-end;
        }

        .btn-save, .btn-cancel {
            padding: 0.4rem 1rem;
            border: none;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s;
        }

        .btn-save { background: var(--accent-green); color: #0d1117; }
        .btn-cancel { background: var(--border); color: var(--text-primary); }
        .btn-save:hover, .btn-cancel:hover { opacity: 0.85; }
        .btn-save:disabled, .btn-cancel:disabled { opacity: 0.5; cursor: not-allowed; }

        /* History panel */
        .history-panel {
            border-top: 1px solid var(--border);
            margin-top: 0.75rem;
            padding-top: 0.75rem;
        }

        .history-title {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .history-entry {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.5rem 0.65rem;
            margin-bottom: 0.4rem;
            font-size: 0.78rem;
        }

        .history-entry.reverted { opacity: 0.6; }

        .history-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.3rem;
        }

        .history-time { color: var(--text-secondary); font-size: 0.72rem; }

        .history-changes { display: flex; flex-direction: column; gap: 0.15rem; }

        .history-change { color: var(--text-primary); }
        .history-key { color: var(--accent-blue); font-weight: 600; }

        .undo-btn, .redo-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 0.68rem;
            padding: 0.15rem 0.45rem;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .undo-btn:hover { border-color: var(--accent-red); color: var(--accent-red); }
        .redo-btn:hover { border-color: var(--accent-green); color: var(--accent-green); }

        @media (max-width: 600px) {
            .summary { flex-direction: column; }
            header { flex-direction: column; gap: 0.5rem; }
            .header-meta { text-align: left; }
            main { padding: 1rem; }
        }
    </style>
</head>
<body>
    <header>
        <h1>Minecraft Bedrock Server Dashboard</h1>
        <div class="header-right">
            <button class="restart-all-btn" onclick="restartAllServers(this)">Restart All</button>
            <div class="header-meta">
                <div>Version: <span id="header-version">--</span></div>
                <div>Last refreshed: <span id="header-refresh">--</span></div>
            </div>
        </div>
    </header>

    <main>
        <div id="error-container"></div>
        <div id="update-container"></div>

        <div class="summary" id="summary-section">
            <div class="summary-card">
                <div class="label">Current Version</div>
                <div class="value" id="summary-version">--</div>
            </div>
            <div class="summary-card">
                <div class="label">Latest Available</div>
                <div class="value small" id="summary-latest">--</div>
            </div>
            <div class="summary-card">
                <div class="label">Servers</div>
                <div class="value" id="summary-servers">--</div>
            </div>
            <div class="summary-card">
                <div class="label">Online</div>
                <div class="value" id="summary-online">--</div>
            </div>
            <div class="summary-card">
                <div class="label">Players Online</div>
                <div class="value" id="summary-players">--</div>
            </div>
            <div class="summary-card">
                <div class="label">Total Updates</div>
                <div class="value" id="summary-updates">--</div>
            </div>
        </div>

        <div class="ports-section">
            <h2 class="section-title">Ports</h2>
            <div id="ports-container">
                <div class="empty-state">Loading...</div>
            </div>
        </div>

        <h2 class="section-title">Servers</h2>
        <div class="server-grid" id="server-grid">
            <div class="empty-state">Loading...</div>
        </div>

        <div class="history-section">
            <h2 class="section-title">Update History</h2>
            <div id="history-container">
                <div class="empty-state">Loading...</div>
            </div>
        </div>

        <div class="log-section">
            <h2 class="section-title">Recent Logs</h2>
            <div class="log-container" id="log-container">
                <div class="empty-state">Loading...</div>
            </div>
            <div class="log-meta" id="log-meta"></div>
        </div>
    </main>

    <script>
        async function fetchJson(endpoint) {
            const res = await fetch(endpoint);
            if (!res.ok) throw new Error(`${endpoint}: HTTP ${res.status}`);
            return res.json();
        }

        function showError(msg) {
            document.getElementById('error-container').innerHTML =
                `<div class="error-banner">Dashboard error: ${escapeHtml(msg)}</div>`;
        }

        function clearError() {
            document.getElementById('error-container').innerHTML = '';
        }

        function escapeHtml(str) {
            const d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML;
        }

        // Single source of truth for a server's liveness state, shared by the
        // server cards, the summary counter, and the Ports panel so they can
        // never disagree. Two backend signals feed it:
        //   s.isRunning – a bedrock_server.exe process exists for this server
        //   s.query     – the server answered a RakNet UDP ping (live data)
        // giving three states:
        //   'online'       – answered the query (reachable; player/version data live)
        //   'unresponsive' – process is up but not answering (starting up or stuck)
        //   'offline'      – no process running
        function serverStatus(s) {
            if (s.query) return 'online';
            if (s.isRunning) return 'unresponsive';
            return 'offline';
        }

        const STATUS_LABELS = { online: 'Online', unresponsive: 'Unresponsive', offline: 'Offline' };

        function boolBadge(value) {
            const on = String(value).toLowerCase() === 'true';
            return `<span class="bool-badge ${on ? 'is-true' : 'is-false'}">${on ? 'ON' : 'OFF'}</span>`;
        }

        function enumBadge(value) {
            const v = String(value).toLowerCase();
            const label = v.charAt(0).toUpperCase() + v.slice(1);
            return `<span class="enum-badge enum-${escapeHtml(v)}">${escapeHtml(label)}</span>`;
        }

        function renderConfig(config) {
            document.getElementById('summary-version').textContent = config.currentMinecraftVersion;
            document.getElementById('header-version').textContent = config.currentMinecraftVersion;
        }

        // Renders the "update pending" banner + the Latest Available summary card from
        // the backend's version check (config version vs Minecraft's newest release).
        function renderUpdate(update) {
            const banner = document.getElementById('update-container');
            const latestEl = document.getElementById('summary-latest');
            const versionEl = document.getElementById('summary-version');

            if (!update) {
                banner.innerHTML = '';
                if (latestEl) latestEl.textContent = '--';
                return;
            }

            // Latest Available summary card
            if (latestEl) {
                if (update.latestVersion) {
                    latestEl.textContent = update.latestVersion;
                    latestEl.className = 'value small ' + (update.updateAvailable ? 'update-pending' : 'up-to-date');
                } else {
                    latestEl.textContent = 'Unknown';
                    latestEl.className = 'value small';
                }
            }
            // Mirror the pending state onto the Current Version card
            if (versionEl) {
                versionEl.className = 'value' + (update.updateAvailable ? ' update-pending' : '');
            }

            // Banner priority: a newer release than we've downloaded > servers lagging the
            // downloaded version > a soft note if the check itself failed > nothing.
            const behind = update.serversBehind || [];
            if (update.updateAvailable) {
                banner.innerHTML = `
                    <div class="update-banner">
                        <span class="up-arrow">⬆</span>
                        <span>
                            Bedrock <strong>${escapeHtml(update.latestVersion)}</strong> is available
                            (current: <strong>${escapeHtml(update.currentVersion || '--')}</strong>).
                            <span class="update-hint">Run the updater (server update.ps1) to download &amp; apply it.</span>
                        </span>
                    </div>`;
            } else if (behind.length) {
                const label = behind.length === 1
                    ? `Server <strong>${escapeHtml(behind[0])}</strong> is`
                    : `<strong>${behind.length}</strong> servers are`;
                banner.innerHTML = `
                    <div class="update-banner">
                        <span class="up-arrow">⬆</span>
                        <span>
                            ${label} behind version <strong>${escapeHtml(update.latestVersion || '')}</strong>.
                            <span class="update-hint">Run the updater (server update.ps1) to apply it${behind.length === 1 ? '' : ' to them'}.</span>
                        </span>
                    </div>`;
            } else if (!update.latestVersion && update.error) {
                banner.innerHTML = `
                    <div class="update-error">
                        Couldn't check Minecraft for the latest version: ${escapeHtml(update.error)}
                    </div>`;
            } else {
                banner.innerHTML = '';
            }
        }

        // Small "update" pill shown next to a server's installed version when it's
        // behind the newest release the dashboard knows about.
        function updatePill(s) {
            if (!s.updateAvailable || !s.latestVersion) return '';
            return `<span class="update-pill" title="Update to ${escapeHtml(s.latestVersion)} available">↑ ${escapeHtml(s.latestVersion)}</span>`;
        }

        function formatRelativeTime(isoString) {
            if (!isoString) return '--';
            const diff = Date.now() - new Date(isoString).getTime();
            const mins = Math.floor(diff / 60000);
            if (mins < 1) return 'just now';
            if (mins < 60) return `${mins}m ago`;
            const hours = Math.floor(mins / 60);
            if (hours < 24) return `${hours}h ago`;
            const days = Math.floor(hours / 24);
            return `${days}d ago`;
        }

        function formatSize(mb) {
            if (mb >= 1024) return `${(mb / 1024).toFixed(1)} GB`;
            return `${mb.toFixed(1)} MB`;
        }


        function updateServerSummary(servers) {
            document.getElementById('summary-servers').textContent = servers.length;
            const onlineCount = servers.filter(s => serverStatus(s) === 'online').length;
            const totalPlayers = servers.reduce((sum, s) => sum + (s.query ? s.query.onlinePlayers : 0), 0);
            const el = document.getElementById('summary-online');
            el.textContent = `${onlineCount} / ${servers.length}`;
            el.style.color = onlineCount > 0 ? 'var(--accent-green)' : 'var(--accent-red)';
            const playersEl = document.getElementById('summary-players');
            playersEl.textContent = totalPlayers;
            playersEl.style.color = totalPlayers > 0 ? 'var(--accent-green)' : '';
        }

        function buildServerCardHtml(s) {
            const q = s.query;
            const state = serverStatus(s);
            const isOnline = state === 'online';
            const statusClass = state;
            const statusText = STATUS_LABELS[state];
            const players = isOnline ? `${q.onlinePlayers} / ${q.maxPlayers}` : '--';
            const playersColor = isOnline && q.onlinePlayers > 0 ? 'var(--accent-green)' : '';

            const bannerUrl = s.bannerExt ? `/api/servers/${encodeURIComponent(s.name)}/banner` : '';

            return `
                <div class="server-card" data-server="${escapeHtml(s.name)}">
                    ${bannerUrl ? `<div class="banner-bg" style="background-image:url('${bannerUrl}')"></div><div class="banner-fade"></div>` : ''}
                    <div class="server-card-header">
                        <h3>${escapeHtml(s.name)}</h3>
                        <div class="card-actions">
                            <button class="edit-btn" onclick="enterEditMode(this.closest('.server-card'), window._serverData['${escapeHtml(s.name)}'])">Edit</button>
                            <button class="history-btn" onclick="toggleHistoryPanel(this.closest('.server-card'), '${escapeHtml(s.name)}')">History</button>
                            <button class="restart-btn" onclick="restartServer('${escapeHtml(s.name)}', this)">Restart</button>
                        </div>
                    </div>
                    <div class="card-console-row">
                        <button class="console-btn" onclick="toggleConsolePanel(this.closest('.server-card'), '${escapeHtml(s.name)}')">Console</button>
                    </div>
                    <div class="server-card-status">
                        <span class="status-badge ${statusClass}">
                            <span class="status-dot"></span>
                            ${statusText}
                        </span>
                    </div>
                    <div class="server-card-details">
                        <div class="server-detail"><span class="key">Players</span><span data-field="players" style="color:${playersColor};font-weight:600">${players}</span></div>
                        <div class="server-detail"><span class="key">Version</span><span><span data-field="version" class="version-tag">${escapeHtml(isOnline ? q.version : s.version)}</span><span data-field="update-badge">${updatePill(s)}</span></span></div>
                        <div class="server-detail"><span class="key">Gamemode</span><span data-field="gamemode">${enumBadge(isOnline ? q.gamemode : s.gamemode)}</span></div>
                        <div class="server-detail"><span class="key">Difficulty</span><span data-field="difficulty">${enumBadge(s.difficulty)}</span></div>
                        <div class="server-detail"><span class="key">Allow Cheats</span><span data-field="allow-cheats">${boolBadge(s.allowCheats)}</span></div>
                        <div class="server-detail"><span class="key">Port</span><span data-field="port">${s.serverPort}</span></div>
                        <div class="server-detail"><span class="key">Port v6</span><span data-field="port-v6">${s.serverPortV6}</span></div>
                        <div class="server-detail"><span class="key">Level Name</span><span data-field="level-name">${escapeHtml(s.levelName)}</span></div>
                        <div class="server-detail"><span class="key">World Size</span><span data-field="world-size">${formatSize(s.worldSizeMB || 0)}</span></div>
                        <div class="server-detail"><span class="key">Last Save</span><span data-field="last-save">${formatRelativeTime(s.lastSave)}</span></div>
                        <div class="server-detail"><span class="key">View Distance</span><span data-field="view-distance">${s.viewDistance || '--'} chunks</span></div>
                        <div class="server-detail"><span class="key">Tick Distance</span><span data-field="tick-distance">${s.tickDistance || '--'} chunks</span></div>
                        <div class="server-detail"><span class="key">Online Mode</span><span data-field="online-mode">${boolBadge(s.onlineMode)}</span></div>
                        <div class="server-detail"><span class="key">Permission Level</span><span data-field="permission">${enumBadge(s.defaultPermission)}</span></div>
                        <div class="server-detail"><span class="key">Allow List</span><span data-field="allow-list">${boolBadge(s.allowList)}</span></div>
                    </div>
                </div>
            `;
        }

        function updateSingleCard(card, s) {
            // Skip cards in edit mode — preserve the form
            if (card.querySelector('.edit-form')) return;

            const q = s.query;
            const state = serverStatus(s);
            const isOnline = state === 'online';

            // Update status badge
            const badge = card.querySelector('.status-badge');
            if (badge) {
                if (!badge.classList.contains(state)) {
                    badge.className = `status-badge ${state}`;
                    badge.innerHTML = `<span class="status-dot"></span>${STATUS_LABELS[state]}`;
                }
            }

            function setField(name, text, styles) {
                const el = card.querySelector(`[data-field="${name}"]`);
                if (!el) return;
                if (el.textContent !== String(text)) el.textContent = text;
                if (styles) {
                    for (const [k, v] of Object.entries(styles)) el.style[k] = v;
                }
            }

            function setBadgeField(name, html) {
                const el = card.querySelector(`[data-field="${name}"]`);
                if (!el) return;
                if (el.innerHTML !== html) el.innerHTML = html;
            }

            const players = isOnline ? `${q.onlinePlayers} / ${q.maxPlayers}` : '--';
            const playersColor = isOnline && q.onlinePlayers > 0 ? 'var(--accent-green)' : '';
            setField('players', players, { color: playersColor, fontWeight: '600' });
            setField('version', isOnline ? q.version : s.version);
            setBadgeField('update-badge', updatePill(s));
            setBadgeField('gamemode', enumBadge(isOnline ? q.gamemode : s.gamemode));
            setBadgeField('difficulty', enumBadge(s.difficulty));
            setBadgeField('allow-cheats', boolBadge(s.allowCheats));
            setField('port', s.serverPort);
            setField('port-v6', s.serverPortV6);
            setField('level-name', s.levelName);
            setField('world-size', formatSize(s.worldSizeMB || 0));
            setField('last-save', formatRelativeTime(s.lastSave));
            setField('view-distance', `${s.viewDistance || '--'} chunks`);
            setField('tick-distance', `${s.tickDistance || '--'} chunks`);
            setBadgeField('online-mode', boolBadge(s.onlineMode));
            setBadgeField('permission', enumBadge(s.defaultPermission));
            setBadgeField('allow-list', boolBadge(s.allowList));
        }

        function updateServerCards(servers, grid) {
            const incoming = new Map(servers.map(s => [s.name, s]));
            const existingCards = grid.querySelectorAll('.server-card[data-server]');
            const existingNames = new Set();

            // Update existing cards, remove stale ones
            existingCards.forEach(card => {
                const name = card.dataset.server;
                if (incoming.has(name)) {
                    existingNames.add(name);
                    updateSingleCard(card, incoming.get(name));
                } else {
                    card.remove();
                }
            });

            // Add new cards
            for (const s of servers) {
                if (!existingNames.has(s.name)) {
                    grid.insertAdjacentHTML('beforeend', buildServerCardHtml(s));
                }
            }

            // Fix ordering — appendChild moves without destroying
            const desiredOrder = servers.map(s => s.name);
            const currentOrder = Array.from(grid.querySelectorAll('.server-card[data-server]')).map(c => c.dataset.server);
            if (JSON.stringify(desiredOrder) !== JSON.stringify(currentOrder)) {
                for (const name of desiredOrder) {
                    const card = grid.querySelector(`.server-card[data-server="${CSS.escape(name)}"]`);
                    if (card) grid.appendChild(card);
                }
            }
        }

        function renderServers(data, forceRender = false) {
            const grid = document.getElementById('server-grid');
            const servers = data.servers || [];

            updateServerSummary(servers);

            // Always update global data for edit-properties.js
            window._serverData = {};
            servers.forEach(s => { window._serverData[s.name] = s; });

            if (typeof renderPortsPanel === 'function') renderPortsPanel(servers);

            if (!servers.length) {
                grid.innerHTML = '<div class="empty-state">No servers found</div>';
                return;
            }

            // Full rebuild on init/forced, or when grid has no cards yet
            if (forceRender || !grid.querySelector('.server-card')) {
                grid.innerHTML = servers.map(s => buildServerCardHtml(s)).join('');
            } else {
                updateServerCards(servers, grid);
            }
        }

        function renderHistory(history) {
            const totalUpdates = history.reduce((sum, h) => sum + h.TimesUpdated, 0);
            document.getElementById('summary-updates').textContent = totalUpdates;

            const json = JSON.stringify(history);
            if (json === _lastHistoryJson) return;
            _lastHistoryJson = json;

            const container = document.getElementById('history-container');

            if (!history.length) {
                container.innerHTML = '<div class="empty-state">No update history</div>';
                return;
            }

            const rows = history.slice().reverse().map(h => `
                <tr>
                    <td><span class="version-tag">${escapeHtml(h.Version)}</span></td>
                    <td>${escapeHtml(h.FirstUpdatedAt)}</td>
                    <td>${escapeHtml(h.LastUpdatedAt)}</td>
                    <td>${h.TimesUpdated}</td>
                </tr>
            `).join('');

            container.innerHTML = `
                <table class="history-table">
                    <thead><tr>
                        <th>Version</th>
                        <th>First Updated</th>
                        <th>Last Updated</th>
                        <th>Times</th>
                    </tr></thead>
                    <tbody>${rows}</tbody>
                </table>
            `;
        }

        function renderLogs(data, forceRender = false) {
            const container = document.getElementById('log-container');
            const meta = document.getElementById('log-meta');

            if (!data.lines.length) {
                _lastLogsJson = '';
                container.innerHTML = '<div class="empty-state">No logs available</div>';
                meta.textContent = '';
                return;
            }

            const json = JSON.stringify(data);
            if (json === _lastLogsJson) return;

            const wasAtBottom = container.scrollTop + container.clientHeight >= container.scrollHeight - 10;

            // If user scrolled up and this is a periodic update, don't replace the DOM
            if (!wasAtBottom && !forceRender && _lastLogsJson !== '') {
                _lastLogsJson = json;
                meta.textContent = `Showing last ${data.lines.length} of ${data.totalLines} log lines`;
                return;
            }

            _lastLogsJson = json;

            container.innerHTML = data.lines.map(line => {
                const match = line.match(/^(\[.+?\])\s(.+)$/);
                const isError = /error/i.test(line);
                const isWarning = /warning/i.test(line);
                const cls = isError ? ' error' : isWarning ? ' warning' : '';

                if (match) {
                    return `<div class="log-line${cls}"><span class="log-timestamp">${escapeHtml(match[1])}</span> <span class="log-message">${escapeHtml(match[2])}</span></div>`;
                }
                return `<div class="log-line${cls}"><span class="log-message">${escapeHtml(line)}</span></div>`;
            }).join('');

            meta.textContent = `Showing last ${data.lines.length} of ${data.totalLines} log lines`;

            if (wasAtBottom || forceRender) {
                container.scrollTop = container.scrollHeight;
            }
        }

        function updateTimestamp() {
            document.getElementById('header-refresh').textContent =
                new Date().toLocaleTimeString();
        }

        // --- Change detection caches ---
        let _lastHistoryJson = '';
        let _lastLogsJson = '';

        // --- WebSocket Connection ---

        let ws = null;
        let reconnectAttempts = 0;
        let pendingRefresh = null;

        function connectWebSocket() {
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${location.host}`);

            ws.onopen = () => {
                reconnectAttempts = 0;
                clearError();
            };

            ws.onmessage = (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    switch (msg.type) {
                        case 'init':
                            clearError();
                            renderConfig(msg.config);
                            renderUpdate(msg.update);
                            renderServers(msg.servers, true);
                            renderHistory(msg.history);
                            renderLogs(msg.logs, true);
                            updateTimestamp();
                            if (pendingRefresh) {
                                const resolve = pendingRefresh;
                                pendingRefresh = null;
                                resolve();
                            }
                            break;
                        case 'update': {
                            clearError();
                            const forceRender = !!window._forceRender;
                            window._forceRender = false;
                            renderConfig(msg.config);
                            renderUpdate(msg.update);
                            renderServers(msg.servers, forceRender);
                            renderHistory(msg.history);
                            renderLogs(msg.logs, forceRender);
                            updateTimestamp();
                            if (pendingRefresh) {
                                const resolve = pendingRefresh;
                                pendingRefresh = null;
                                resolve();
                            }
                            break;
                        }
                        case 'live-reload':
                            location.reload();
                            break;
                        case 'error':
                            showError(msg.message);
                            break;
                    }
                } catch (err) {
                    console.error('WebSocket message error:', err);
                }
            };

            ws.onclose = () => {
                ws = null;
                scheduleReconnect();
            };

            ws.onerror = () => {};
        }

        function scheduleReconnect() {
            reconnectAttempts++;
            const delay = Math.min(1000 * Math.pow(2, reconnectAttempts - 1), 30000);
            showError(`Connection lost. Reconnecting in ${Math.round(delay / 1000)}s...`);
            setTimeout(connectWebSocket, delay);
        }

        // Promise-based refresh for edit-properties.js compatibility
        async function refresh() {
            return new Promise((resolve) => {
                pendingRefresh = resolve;
                window._forceRender = true;
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'request-refresh' }));
                } else {
                    pendingRefresh = null;
                    resolve();
                }
                setTimeout(() => {
                    if (pendingRefresh === resolve) {
                        pendingRefresh = null;
                        resolve();
                    }
                }, 5000);
            });
        }

        document.addEventListener('DOMContentLoaded', connectWebSocket);
    </script>
    <script src="/js/edit-properties.js"></script>
    <script src="/js/ports-panel.js"></script>
    <script src="/js/restart.js"></script>
    <script src="/js/console.js"></script>
</body>
